<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nano-9 web cart</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      #nano9-canvas { width: 100%; height: 100%; outline: none; }
    </style>
    <!--
      16MB wasm stack is set in .cargo/config.toml
      (`-C link-arg=-zstack-size=16777216`). Asset `.meta` files are skipped
      via AssetMetaCheck::Never on wasm.
    -->
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="web_cart"
      data-cargo-features="web"
      data-cargo-no-default-features
      data-wasm-opt="0"
    />
    <link data-trunk rel="copy-dir" href="../assets" data-target-path="assets" />
  </head>
  <body>
    <canvas id="nano9-canvas"></canvas>
  </body>
</html>
